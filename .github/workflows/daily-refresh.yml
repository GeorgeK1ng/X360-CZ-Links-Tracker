name: Denní kontrola a publikace katalogu

on:
  push:
    branches: [main]
    paths:
      - 'source/X360_CZ_GamesList_web_databaze.xlsx'
      - 'archive_tool.py'
      - 'x360archive/**'
      - 'catalog/local-aliases.json'
      - 'catalog/remote-aliases.json'
      - 'config.ci.json'
      - '.github/workflows/daily-refresh.yml'
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: x360-daily-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Vytvořit katalog, zkontrolovat Webshare a aktualizovat web
        run: python archive_tool.py --config config.ci.json refresh --remote-only
      - name: Spustit testy
        run: python -m unittest -q
      - name: Uložit aktualizovaný katalog a stav
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/games.json docs/data/games.json docs/data/missing.json
          if ! git diff --cached --quiet; then
            git commit -m 'Denní aktualizace katalogu'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
